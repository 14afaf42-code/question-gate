entElement.classList.contains('bank')?s.querySelector('.drop'):s.querySelector('.bank'))});t.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag=t;start=[e.clientX,e.clientY];t.setPointerCapture(e.pointerId)});t.addEventListener('pointermove',e=>{if(drag!==t)return;if(!ghost&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>7){ghost=t.cloneNode(true);ghost.classList.add('ghost');document.body.append(ghost)}if(ghost){ghost.style.left=e.clientX+8+'px';ghost.style.top=e.clientY+8+'px'}});t.addEventListener('pointerup',e=>{if(drag!==t)return;if(ghost){let el=document.elementFromPoint(e.clientX,e.clientY),target=el?.closest('.bank,.drop'),before=el?.closest('.tile');if(before===t)before=null;if(before&&before.parentElement!==target)before=null;move(t,target,before);ghost.remove();ghost=null;t.dataset.moved='1';setTimeout(()=>t.dataset.moved='0',0)}drag=null});t.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null;drag=null});return t}data.forEach((q,i)=>{if(i===0||i===2){let h=document.createElement('h2');h.textContent=i===0?'B. Rearrange the words. (2 marks)':'C. Correct the mistake. (2 marks)';qs.append(h);let hint=document.createElement('small');hint.textContent='Drag words into the answer box, or tap to move them. Drag to reorder; tap to return.';qs.append(hint)}let s=document.createElement('section');s.id='q'+(i+3);s.innerHTML=`<p><b>${i+3}. ${q[0]}</b></p><div class="bank"></div><div class="drop" aria-label="Answer box"></div><div class="feedback"></div>`;q[1].forEach(w=>s.querySelector('.bank').append(tile(w)));qs.append(s)});const corrections=[['She didn’t watched TV.',['watch','watched','watches'],0],['We didn’t saw the movie.',['saw','sees','see'],2]];let heading=document.createElement('h2');heading.textContent='C. Correct the mistake. (2 marks)';qs.append(heading);corrections.forEach((q,i)=>{let s=document.createElement('section');s.id='q'+(i+5);s.innerHTML=`<p><b>${i+5}. ${q[0]}</b></p><small>Choose the correct verb.</small><div class="options">${q[1].map((w,j)=>`<label><input type="radio" name="c${i}" value="${j}"> ${w}</label>`).join('')}</div><div class="feedback"></div>`;qs.append(s)});qs.addEventListener('change',e=>clearMark(e.target.closest('section')));document.querySelector('#submit').onclick=()=>{let score=0;for(let i=0;i<6;i++){let s=document.querySelector('#q'+(i+1)),ok=i<2?Number(s.querySelector('input:checked')?.value??-1)===mc[i][2]:i>=4?Number(s.querySelector('input:checked')?.value??-1)===corrections[i-4][2]:Array.from(s.querySelectorAll('.drop .tile')).map(t=>t.textContent).join(' ')===data[i-2][2].join(' ');score+=Number(ok);s.classList.toggle('good',ok);s.classList.toggle('bad',!ok);s.querySelector('.feedback').textContent=ok?'✓ Correct!':'Try again!'}document.querySelector('#score').textContent=`Score: ${score} / 6`;document.querySelector('#result').textContent=score===6?'Excellent, traveler! ★':`Keep practicing, traveler! ${score}/6`;document.querySelector('.info').scrollIntoView({behavior:'smooth'})};document.querySelector('#reset').onclick=()=>{document.querySelectorAll('input[type=radio]').forEach(t=>t.checked=false);data.forEach((q,i)=>{let s=document.querySelector('#q'+(i+3));s.querySelector('.drop').replaceChildren();s.querySelector('.bank').replaceChildren(...q[1].map(tile))});document.querySelectorAll('section').forEach(clearMark)};</script>
